name: CI/CD to Minikube

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          installed=0
          # uv: export the full lock (incl. dev/test groups) and install system-wide.
          if [ -f uv.lock ] || grep -qs "tool.uv" pyproject.toml; then
            pip install uv
            if uv export --no-hashes --all-extras --all-groups -o /tmp/uv-reqs.txt 2>/dev/null; then
              pip install -r /tmp/uv-reqs.txt && installed=1
            fi
            if [ "$installed" = 0 ]; then uv pip install --system -e . && installed=1; fi
          fi
          # poetry: disable its venv so deps land in the system env.
          if [ "$installed" = 0 ]; then
            if [ -f poetry.lock ] || grep -qs "tool.poetry" pyproject.toml; then
              pip install poetry
              poetry config virtualenvs.create false
              poetry install --no-interaction --with dev,test || poetry install --no-interaction || true
              installed=1
            fi
          fi
          # pipenv: --system installs into the system env.
          if [ "$installed" = 0 ] && [ -f Pipfile ]; then
            pip install pipenv
            pipenv install --dev --system --deploy || pipenv install --dev --system || true
            installed=1
          fi
          # Fallback: requirements*.txt + pyproject extras / PEP 735 groups.
          if [ "$installed" = 0 ]; then
            [ -f requirements.txt ] && pip install -r requirements.txt
            for req in requirements-dev.txt requirements-test.txt requirements-tests.txt \
                       dev-requirements.txt test-requirements.txt \
                       requirements/dev.txt requirements/test.txt requirements/tests.txt; do
              [ -f "$req" ] && pip install -r "$req"
            done
            if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
              pip install --group dev --group test 2>/dev/null \
                || pip install -e ".[test]" || pip install -e ".[tests]" \
                || pip install -e ".[dev]" || pip install -e . || true
            fi
          fi
      - name: Build Docker image
        run: docker build -t todo-list-dockerized-flask-webapp:latest .

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Start Minikube
        uses: medyagh/setup-minikube@latest
      - name: Build image inside Minikube
        run: |
          eval $(minikube docker-env)
          docker build -t todo-list-dockerized-flask-webapp:latest .
      - name: Create Kubernetes manifest
        run: |
          mkdir -p /tmp/devops-autopilot-k8s
          cat > /tmp/devops-autopilot-k8s/deployment.yaml <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: todo-list-dockerized-flask-webapp
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: todo-list-dockerized-flask-webapp
            template:
              metadata:
                labels:
                  app: todo-list-dockerized-flask-webapp
              spec:
                containers:
                  - name: todo-list-dockerized-flask-webapp
                    image: todo-list-dockerized-flask-webapp:latest
                    imagePullPolicy: Never
                    ports:
                      - containerPort: 5000
                    readinessProbe:
                      tcpSocket:
                        port: 5000
                      initialDelaySeconds: 5
                      periodSeconds: 5
                    livenessProbe:
                      tcpSocket:
                        port: 5000
                      initialDelaySeconds: 15
                      periodSeconds: 10
          EOF
      - name: Deploy to Minikube
        run: |
          if [ -d k8s ]; then
            kubectl apply -f k8s/
          else
            kubectl apply -f /tmp/devops-autopilot-k8s/deployment.yaml
          fi
      - name: Expose app inside cluster
        run: |
          kubectl expose deployment todo-list-dockerized-flask-webapp \
            --name=todo-list-dockerized-flask-webapp \
            --type=ClusterIP \
            --port=80 \
            --target-port=5000 \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Wait for rollout
        run: kubectl rollout status deployment/todo-list-dockerized-flask-webapp --timeout=120s
      - name: Smoke test deployed app
        run: |
          kubectl port-forward service/todo-list-dockerized-flask-webapp 18080:80 > /tmp/todo-list-dockerized-flask-webapp-port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT

          for path in /health /health/ /; do
            for attempt in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:18080$path" >/tmp/todo-list-dockerized-flask-webapp-response.txt; then
                echo "Smoke test passed on $path"
                exit 0
              fi
              sleep 2
            done
          done

          echo "Smoke test failed: app did not return a successful HTTP response."
          cat /tmp/todo-list-dockerized-flask-webapp-port-forward.log || true
          kubectl get pods -o wide
          kubectl describe deployment todo-list-dockerized-flask-webapp
          kubectl logs deployment/todo-list-dockerized-flask-webapp --tail=100 || true
          exit 1
